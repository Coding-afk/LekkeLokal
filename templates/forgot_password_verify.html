<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/images/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/images/favicon-180.png" />
<title>Password reset OTP - Lekke Lokal</title>
<link rel="stylesheet" href="assets/css/styles.css?v=final-ready-v3" />
    </head>
<body>
  <main class="auth-page">
    <section class="auth-shell auth-shell--single">
      <section class="auth-right auth-right--centered">
        <div class="form-card">
          <div class="form-header">
            <h2>Password reset OTP</h2>
            <p>Enter the 6-digit code sent to <strong>{{MASKED_EMAIL}}</strong>.</p>
          </div>
          {{NOTICE}}
          <form class="form-grid" action="forgot_password.php?step=verify" method="POST">
            {{CSRF_INPUT}}
            <input type="hidden" name="reset_action" value="verify">
            <div class="field">
              <label for="reset_code">Reset OTP</label>
              <input type="text" id="reset_code" name="reset_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required>
            </div>
            <button class="btn" type="submit">Verify reset code</button>
          </form>
          <p class="subtle"><a href="forgot_password.php">Request a new code</a> • <a href="index.php">Back to login</a></p>
        </div>
        <p class="footer-note">Lekke Lokal • So Lekke, So Lokal</p>
      </section>
    </section>
  </main>
</body>
</html>
