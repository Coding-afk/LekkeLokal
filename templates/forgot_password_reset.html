<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/images/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/images/favicon-180.png" />
  <title>Create new password - Lekke Lokal</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=final-ready-v3" />
  <script defer src="assets/js/script.js?v=final-ready-v3"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell auth-shell--single">
      <section class="auth-right auth-right--centered">
        <div class="form-card">
          <div class="form-header">
            <h2>Create new password</h2>
            <p>Enter and confirm your new password.</p>
          </div>

          {{NOTICE}}

          <form class="form-grid" action="forgot_password.php?step=reset" method="POST">
            {{CSRF_INPUT}}
            <input type="hidden" name="reset_action" value="reset">

            <div class="field">
              <label for="new_password">New password</label>
              <div class="password-wrap">
                <input type="password" id="new_password" name="new_password" required>
                <button type="button" data-toggle-password="new_password" data-show-text="Show" data-hide-text="Hide">Show</button>
              </div>

              <div class="password-requirements">
                <strong>Password requirements</strong>
                <ul>
                  <li>At least 10 characters</li>
                  <li>One uppercase letter</li>
                  <li>One lowercase letter</li>
                  <li>One number</li>
                  <li>One special character</li>
                </ul>
              </div>
            </div>

            <div class="field">
              <label for="confirm_password">Confirm password</label>
              <div class="password-wrap">
                <input type="password" id="confirm_password" name="confirm_password" required>
                <button type="button" data-toggle-password="confirm_password" data-show-text="Show" data-hide-text="Hide">Show</button>
              </div>
            </div>

            <button class="btn" type="submit">Update password</button>
          </form>

          <p class="subtle"><a href="index.php">Back to login</a></p>
        </div>

        <p class="footer-note">Lekke Lokal • So Lekke, So Lokal</p>
      </section>
    </section>
  </main>
</body>
</html>
